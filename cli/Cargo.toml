[package]
name = "rh"
version = "0.1.0"
edition = "2021"
publish = false
description = "Interactive CLI runner for the Rust course (rust-handbook)"

[[bin]]
name = "rh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
console = "0.15"
ctrlc = "3"
dialoguer = "0.11"
indicatif = "0.17"
notify = "6"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
termimad = "0.31"
