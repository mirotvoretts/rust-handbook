# Виртуальный workspace курса: каждое упражнение и каждое решение — отдельный крейт.
# Запуск всего сразу:   cargo test --workspace
# Одно упражнение:      cargo test -p ex-06-01-move-basics
[workspace]
resolver = "2"
members = [
    "cli",
    "modules/*/exercises/*",
    "modules/*/solutions/*",
]
# Фикстуры для тестов CLI - обычные каталоги с Cargo.toml, но не члены workspace.
exclude = ["cli/tests/fixtures"]
